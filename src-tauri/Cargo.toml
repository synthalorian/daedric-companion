[package]
name = "daedric-companion"
version = "0.1.0"
edition = "2021"
description = "Daedric Companion — desktop dashboard for the Daedric Online server"

[lib]
name = "daedric_companion_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "daedric-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
daedric-api = { path = "../crates/api" }
