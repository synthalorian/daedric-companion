[package]
name = "daedric-api"
version = "0.1.0"
edition = "2021"
description = "Client for the Daedric Online server surface: status, news, RakNet latency, update feed"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ureq = { version = "2", features = ["json"] }
